# Publishes 06-automation-website to GitHub Pages whenever it changes on main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish website
on:
  push:
    branches: [master]
    paths: ["06-automation-website/**", ".github/workflows/website.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect only the public site files
        run: |
          mkdir _site
          rsync -a --exclude '*.md' --exclude '_src' --exclude 'marketing' 06-automation-website/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
