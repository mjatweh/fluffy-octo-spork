title = "Weekly deal pipeline review"
description = "What's new, what's stuck and what needs a decision across the family office pipeline."

goal = """
Run the weekly deal pipeline review for {week}.
- Deal Analyst: screen anything new in the inbox first, then review the pipeline: counts per stage,
